desc: 全国油价查询与出图播报（ShowAPI 数据源）：多省推送、AI 生图每日海报（5 风格按日轮换，同日同风格）、推送频率（每日/每周/关闭，全局默认+目标行覆盖）、调价预警（配置提前天数内推算预告、公告发布后推官方数、落地确认，AI 图片）、通用推送目标（QQ/任意平台 UMO/飞书 webhook/自建应用混配，不区分平台）、会话选择器与群内一键订阅、推送省份自适应查询偏好、油价走势折线图、月度走势推送、加油结算单、目标绑定查询限额、WebUI 设置与统计页。
short_desc: 全国油价查询、AI 生图海报、多平台通用定时推送与走势统计。
